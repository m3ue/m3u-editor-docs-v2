<!doctype html>
<!--
  Blog featured image template (1200x630), rendered by
  scripts/generate-featured-image.js. It also draws the labelled placeholders
  that stand in for screenshots nobody has taken yet.

  The script passes everything in ?data= (base64 JSON), so nothing in here is
  specific to one post. Each post's text and layout live in
  scripts/featured-images/<slug>/card.json. The look follows the site's social
  cards (scripts/social-cards/card.html).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Featured image</title>
<style>
  @font-face {
    font-family: 'Plus Jakarta Sans';
    font-weight: 200 800;
    src: url('../../src/fonts/plus-jakarta-sans/PlusJakartaSans-Variable.woff2') format('woff2');
  }

  * { box-sizing: border-box; margin: 0; }

  html, body { overflow: hidden; }

  body {
    position: relative;
    font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    color: #fff;
  }

  /* Featured image */
  body.card {
    width: 1200px;
    height: 630px;
    background:
      radial-gradient(ellipse 60% 70% at 10% 10%, rgba(244, 63, 94, 0.45), transparent 60%),
      radial-gradient(ellipse 55% 60% at 90% 20%, rgba(99, 102, 241, 0.5), transparent 60%),
      radial-gradient(ellipse 60% 50% at 50% 110%, rgba(179, 80, 159, 0.45), transparent 60%),
      #0b1020;
  }

  .grid {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
    background-size: 50px 50px;
    -webkit-mask-image: radial-gradient(ellipse at center, #000 30%, transparent 80%);
  }

  .copy {
    position: absolute;
    left: 64px;
    top: 0;
    bottom: 0;
    width: 500px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    z-index: 20;
  }

  .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 34px; }

  .brand .mark {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    padding: 5px;
    background: rgba(255, 255, 255, 0.95);
    box-shadow: 0 0 30px rgba(244, 63, 94, 0.35), 0 0 50px rgba(99, 102, 241, 0.25);
  }

  .brand .mark img { display: block; width: 100%; height: 100%; }

  .brand span { margin-left: 6px; font-size: 21px; font-weight: 700; letter-spacing: -0.01em; }

  h1 {
    font-size: 56px;
    line-height: 1.08;
    font-weight: 800;
    letter-spacing: -0.035em;
  }

  h1 em {
    display: block;
    font-style: normal;
    background: linear-gradient(90deg, #fb7185 0%, #d8a0f5 50%, #a5b4fc 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  p {
    margin-top: 24px;
    font-size: 21px;
    line-height: 1.5;
    color: rgba(226, 232, 240, 0.9);
  }

  .frame {
    position: absolute;
    background: #07070b;
    border: 1px solid rgba(255, 255, 255, 0.14);
    box-shadow: 0 0 60px rgba(99, 102, 241, 0.3), 0 30px 60px rgba(0, 0, 0, 0.5);
  }

  .frame img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top left; }

  .frame-tv { padding: 6px; border-radius: 10px; }
  .frame-tv img { border-radius: 5px; }

  .frame-tablet { padding: 7px; border-radius: 16px; }
  .frame-tablet img { border-radius: 9px; }

  .frame-phone { padding: 5px; border-radius: 20px; }
  .frame-phone img { border-radius: 15px; }

  .frame-browser { padding: 24px 0 0; border-radius: 10px; overflow: hidden; }
  .frame-browser::before {
    content: '';
    position: absolute;
    top: 9px;
    left: 11px;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #fb7185;
    box-shadow: 13px 0 0 #fbbf24, 26px 0 0 #34d399;
  }

  /* Placeholder screenshot */
  body.placeholder {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3.5vmin;
    padding: 6vmin;
    width: 100vw;
    height: 100vh;
    text-align: center;
    background:
      repeating-linear-gradient(45deg, rgba(255, 255, 255, 0.025) 0 24px, transparent 24px 48px),
      linear-gradient(135deg, #1e1b3a, #2a1529);
  }

  .placeholder-tag {
    font-size: 3.4vmin;
    font-weight: 800;
    letter-spacing: 0.14em;
    color: #fb7185;
  }

  .placeholder-label { font-size: 5.2vmin; font-weight: 700; line-height: 1.3; }

  .placeholder-file {
    padding: 1.4vmin 2.6vmin;
    border-radius: 1.2vmin;
    font-family: ui-monospace, Menlo, monospace;
    font-size: 3vmin;
    color: rgba(226, 232, 240, 0.85);
    background: rgba(0, 0, 0, 0.35);
  }
</style>
</head>
<body>
  <script>
    const data = JSON.parse(decodeURIComponent(escape(atob(new URLSearchParams(location.search).get('data')))));
    const element = (tag, attributes = {}, children = []) => {
      const node = document.createElement(tag);
      Object.assign(node, attributes);
      node.append(...children);
      return node;
    };

    if (data.placeholder) {
      document.body.className = 'placeholder';
      document.body.append(
        element('div', { className: 'placeholder-tag', textContent: 'SCREENSHOT NEEDED' }),
        element('div', { className: 'placeholder-label', textContent: data.placeholder.label }),
        element('div', { className: 'placeholder-file', textContent: data.placeholder.file }),
      );
    } else {
      const logos = { editor: '../../static/img/logo.svg', tv: '../../static/img/tv-logo.svg' };
      document.body.className = 'card';
      document.body.append(
        element('div', { className: 'grid' }),
        element('div', { className: 'copy' }, [
          element('div', { className: 'brand' }, [
            ...data.logos.map((logo) => element('div', { className: 'mark' }, [element('img', { src: logos[logo] })])),
            element('span', { textContent: data.brand }),
          ]),
          element('h1', {}, [data.title, element('em', { textContent: data.accent })]),
          element('p', { textContent: data.text }),
        ]),
        ...data.shots.map((shot) => {
          const [left, top, width, height] = shot.box;
          const frame = element('div', { className: `frame frame-${shot.frame}` }, [element('img', { src: shot.src })]);
          Object.assign(frame.style, {
            left: `${left}px`,
            top: `${top}px`,
            width: `${width}px`,
            height: `${height}px`,
            zIndex: shot.z ?? 1,
          });
          return frame;
        }),
      );
    }
  </script>
</body>
</html>
